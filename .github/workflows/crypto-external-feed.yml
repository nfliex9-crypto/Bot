name: Crypto external exchange data witness (READ ONLY)

on:
  pull_request:
    branches:
      - sentinel-adaptive-intelligence-v2
    paths:
      - 'crypto/external-stack/verify_live.py'
      - 'crypto/external-stack/test_verify_live.py'
      - 'crypto/external-stack/requirements.txt'
      - '.github/workflows/crypto-external-feed.yml'
  push:
    branches:
      - sentinel-crypto-orderflow-v1
    paths:
      - 'crypto/external-stack/**'
      - '.github/workflows/crypto-external-feed.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-unit-tests:
    name: Source freshness and fail-closed contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s crypto/external-stack -p 'test_*.py' -v

  verify-real-market-feed:
    name: Real Kraken Spot L2 + trades (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: crypto/external-stack/requirements.txt
      - name: Install pinned upstream library
        run: python -m pip install -r crypto/external-stack/requirements.txt
      - name: Witness real public WebSocket events from Kraken
        run: python crypto/external-stack/verify_live.py --exchange KRAKEN --symbol BTC-USD --seconds 45
      - name: Fetch upstream release (official recorder; no custom exchange gateway)
        run: git clone --depth 1 --branch v3.0.5 https://github.com/bmoscon/cryptofeed.git /tmp/cryptofeed-v3.0.5
      - name: Capture external WebSocket frames with upstream tool
        run: python /tmp/cryptofeed-v3.0.5/examples/record.py KRAKEN BTC-USD --duration 20 --out ./crypto-captures/
      - name: Verify capture exists (NOT a trading signal)
        shell: bash
        run: |
          files=$(find crypto-captures -type f -size +0c | wc -l)
          test "$files" -gt 0
          echo "Captured nonempty PCAP/metadata files: $files"
      - name: Replay capture with upstream Cryptofeed decoder twice, fail closed
        shell: bash
        run: |
          set -euo pipefail
          pcap=$(find crypto-captures -maxdepth 1 -type f -name '*.pcap.zst' -print -quit)
          test -n "$pcap"
          meta="${pcap%.pcap.zst}.meta.json"
          test -s "$meta"
          pcap_sha=$(sha256sum "$pcap" | cut -d ' ' -f 1)
          meta_sha=$(sha256sum "$meta" | cut -d ' ' -f 1)
          printf '%s  %s\n%s  %s\n' "$pcap_sha" "$(basename "$pcap")" "$meta_sha" "$(basename "$meta")" > crypto-captures/SHA256SUMS
          python crypto/external-stack/replay_verified.py "$pcap" --venue KRAKEN --symbol BTC-USD --repeat 2 --expected-pcap-sha256 "$pcap_sha" --expected-meta-sha256 "$meta_sha" --out crypto-captures/replay-verification.json
          (cd crypto-captures && sha256sum --check --status SHA256SUMS)
          cp "$pcap" "${pcap}.tampered"
          printf 'corrupt' >> "${pcap}.tampered"
          if python crypto/external-stack/replay_verified.py "${pcap}.tampered" --venue KRAKEN --symbol BTC-USD --expected-pcap-sha256 "$pcap_sha"; then
            echo "ERROR: tampered extension did not fail"; exit 1
          fi
          rm -f "${pcap}.tampered"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("crypto-captures/replay-verification.json").read_text())
          assert report["status"] == "VERIFIED_REAL_CAPTURE_REPLAY"
          assert report["replay_passes"] == 2
          assert report["trades"] > 0 and report["books"] > 0
          assert report["order_regressions"] == 0 and not report["orders_enabled"]
          print("ACCEPTED_AUTHENTIC_REPLAY",report["trades"],report["books"])
          PY
      - name: Preserve exchange-origin capture
        uses: actions/upload-artifact@v4
        with:
          name: crypto-public-kraken-pcap
          path: crypto-captures/
          retention-days: 7
          if-no-files-found: error