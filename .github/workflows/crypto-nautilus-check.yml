name: NautilusTrader v2 crypto adapter (READ ONLY)

on:
  push:
    branches: [sentinel-crypto-orderflow-v1]
    paths:
      - 'crypto/external-stack/nautilus_kraken_spot.py'
      - 'crypto/external-stack/requirements-nautilus.txt'
      - '.github/workflows/crypto-nautilus-check.yml'
  pull_request:
    branches: [sentinel-adaptive-intelligence-v2]
    paths:
      - 'crypto/external-stack/nautilus_kraken_spot.py'
      - 'crypto/external-stack/requirements-nautilus.txt'
      - '.github/workflows/crypto-nautilus-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  official-venue-adapter-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact research upstream wheel
        run: python -m pip install -r crypto/external-stack/requirements-nautilus.txt
      - name: Verify exact v2 research wheel and mandatory native L2 subscription
        run: |
          python - <<'PY'
          import nautilus_trader
          assert nautilus_trader.__version__ == "2.0.0rc9", nautilus_trader.__version__
          import sys
          sys.path.insert(0, "crypto/external-stack")
          from nautilus_kraken_spot import build_readonly_node, build_tester_config
          config = build_tester_config()
          assert config.subscribe_book_deltas, "Missing native L2 subscription"
          assert config.manage_book, "Native order book reconstruction disabled"
          assert config.subscribe_trades, "Missing real executed trade subscription"
          assert config.book_depth == 10, "Invalid order book depth"
          node = build_readonly_node()
          print("READ_ONLY_NATIVE_L2_TRADES_NODE_BUILT", type(node).__name__)
          PY
      - name: Exercise genuine Kraken native L2 and trade subscriptions (30 seconds)
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=15s 30s python -u crypto/external-stack/nautilus_kraken_spot.py > nautilus-kraken-live.log 2>&1
          exit_code=$?
          set -e
          echo "Data-only lifecycle exit code: $exit_code"
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 124 ]; then
            tail -80 nautilus-kraken-live.log
            exit "$exit_code"
          fi
          grep -E -q 'TradeTick[[:space:]]*\\{' nautilus-kraken-live.log || { tail -100 nautilus-kraken-live.log; echo "NO_VERIFIED_NAUTILUS_TRADE_TICK"; exit 1; }
          echo "NATIVE_NAUTILUS_REAL_TRADE_TICKS_OBSERVED"
      - name: Preserve Kraken public market-data log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nautilus-kraken-spot-live-diagnostics
          path: nautilus-kraken-live.log
          retention-days: 7
          if-no-files-found: warn
