name: Sentinel gross-only research tests
on:
  push:
    branches: [sentinel-delta-composite-research-v1]
    paths:
      - '.github/workflows/sentinel-gross-ci.yml'
      - 'sentinel-console/brain/**'
      - 'sentinel-console/worker/orderflow/**'
      - 'sentinel-console/worker/cloud-trader/**'
      - 'sentinel-console/worker/runner.js'
      - 'sentinel-console/tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-gross-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regression tests - gross research, Delta, safeguards
        run: |
          set -euo pipefail
          node --test sentinel-console/tests/brain.test.cjs \
            sentinel-console/tests/edge-lab.test.cjs \
            sentinel-console/tests/autonomy.test.cjs \
            sentinel-console/tests/broker-hypotheses.test.cjs \
            sentinel-console/tests/weekly-demo-review.test.cjs \
            sentinel-console/tests/delta-composite.test.cjs \
            sentinel-console/tests/composite-gross.test.cjs \
            sentinel-console/tests/orderflows-delta.test.cjs \
            sentinel-console/tests/cloud-trader.test.cjs
