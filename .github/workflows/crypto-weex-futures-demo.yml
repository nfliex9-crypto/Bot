name: WEEX perpetual futures data and DEMO route (NO REAL ORDERS)

on:
  push:
    branches: [sentinel-crypto-orderflow-v1]
    paths:
      - 'crypto/futures-demo/**'
      - '.github/workflows/crypto-weex-futures-demo.yml'
  pull_request:
    branches: [sentinel-adaptive-intelligence-v2]
    paths:
      - 'crypto/futures-demo/**'
      - '.github/workflows/crypto-weex-futures-demo.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upstream-ccxt-safety:
    name: Confirm no spot, no production private routing
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install upstream pinned CCXT Pro
        run: python -m pip install -r crypto/futures-demo/requirements.txt
      - name: Prove actual installed upstream CCXT version
        run: python -c "import ccxt,ccxt.pro;assert ccxt.__version__=='4.5.93';assert hasattr(ccxt.pro,'weex')"
      - name: Run fail-closed contract tests including demo-only signed request URLs
        run: python -m unittest discover -s crypto/futures-demo -p 'test_*.py' -v
      - name: Ensure account without secrets cannot be authenticated
        shell: bash
        run: |
          set +e
          env -u WEEX_SIM_API_KEY -u WEEX_SIM_API_SECRET -u WEEX_SIM_API_PASSPHRASE python crypto/futures-demo/weex_demo_account.py > unconnected-account.json
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          x=json.load(open("unconnected-account.json"))
          assert x["status"]=="DEMO_ACCOUNT_NOT_CONNECTED" and x["orders_placed"]==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weex-demo-safe-configuration
          path: unconnected-account.json
          retention-days: 7

  genuine-perpetual-orderflow:
    name: Live WEEX USDT Perpetual Order Book & Trade Tape
    needs: upstream-ccxt-safety
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: btc
            symbol: BTC/USDT:USDT
          - id: eth
            symbol: ETH/USDT:USDT
          - id: sol
            symbol: SOL/USDT:USDT
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r crypto/futures-demo/requirements.txt
      - name: Verify real futures WS (not spot and not synthetic)
        shell: bash
        run: |
          python crypto/futures-demo/weex_futures_feed.py --symbol '${{ matrix.symbol }}' --seconds 40 | tee weex-perpetual-witness.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("weex-perpetual-witness.json").read_text().splitlines()[-1])
          assert x["status"] == "LIVE_WEEX_PERP_FEED_VERIFIED"
          assert x["market"] == "USDT_LINEAR_PERPETUAL"
          assert x["book_update_callbacks"] > 0 and x["unique_executed_trades"] > 0
          assert x["spot_prices_used"] is False and x["orders_enabled"] is False
          PY
      - name: Save source-labeled public futures observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weex-real-perpetual-l2-trades-${{ matrix.id }}
          path: weex-perpetual-witness.json
          retention-days: 7
          if-no-files-found: warn

  futures-reference:
    name: Public WEEX Perpetual Last / Mark / Index / Funding / OI
    needs: upstream-ccxt-safety
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r crypto/futures-demo/requirements.txt
      - name: Read authentic Futures contract reference values (no spot/keys)
        shell: bash
        run: |
          python crypto/futures-demo/weex_futures_reference.py --symbol 'BTC/USDT:USDT' --out futures-reference.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("futures-reference.json").read_text())
          assert d["status"]=="VERIFIED_PUBLIC_PERPETUAL_REFERENCE"
          assert d["mark_price"]>0 and d["index_price"]>0 and d["last_futures_price"]>0
          assert d["open_interest_contract_units"]>0 and not d["orders_enabled"]
          assert d["uses_spot_price"] is False
          PY
      - name: Preserve reference prices with venue timestamps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weex-public-futures-mark-index-funding-oi
          path: futures-reference.json
          retention-days: 7
          if-no-files-found: warn

  futures-parquet:
    name: Arrow Parquet capture of genuine WEEX BTC Perpetual L2 and tape
    needs: upstream-ccxt-safety
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r crypto/futures-demo/requirements.txt
      - name: Collect from actual WEEX contract websocket, not the Spot book
        shell: bash
        run: |
          python crypto/futures-demo/weex_futures_parquet.py --symbol 'BTC/USDT:USDT' --seconds 40 --out-dir "${{ runner.temp }}/weex-futures" | tee parquet-verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("parquet-verification.json").read_text().strip().splitlines()[-1])
          assert d["status"]=="VERIFIED_WEEX_REAL_FUTURES_PARQUET"
          assert d["book_rows"]>0 and d["trade_rows"]>0
          assert not d["orders_enabled"] and not d["synthetic_market_data"]
          PY
      - name: Write SHA256 checksum for portable archive attestation
        shell: bash
        run: |
          cd "${{ runner.temp }}/weex-futures"
          sha256sum ./*.parquet ./*.manifest.json > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload authenticated-source market-data artifacts (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weex-btc-perpetual-real-parquet
          path: |
            ${{ runner.temp }}/weex-futures/
            parquet-verification.json
          retention-days: 7
          if-no-files-found: warn

  futures-demo-order-preview:
    name: Real-market CCXT Futures DEMO order preview (zero order requests)
    needs: upstream-ccxt-safety
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r crypto/futures-demo/requirements.txt
      - name: Validate real market precision for a BUY and SELL simulator preview
        shell: bash
        run: |
          python crypto/futures-demo/weex_demo_order_preview.py --symbol 'BTC/USDT:USDT' --side buy | tee buy-preview.json
          python crypto/futures-demo/weex_demo_order_preview.py --symbol 'BTC/USDT:USDT' --side sell | tee sell-preview.json
          python - <<'PY'
          import json
          for side in ("buy","sell"):
              d=json.load(open(side+"-preview.json"))
              assert d["status"]=="WEEX_FUTURES_DEMO_ORDER_PREVIEW_ONLY"
              assert d["order_side"]==side and d["destination_host"]=="api-sim.weex.com"
              assert d["market"]=="USDT_LINEAR_PERPETUAL"
              assert d["actual_http_requests_sent_for_order"]==0
              assert d["simulated_exchange_orders_placed"]==0 and d["live_orders_placed"]==0
          PY
      - name: Preserve proof of zero-order simulator routing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weex-futures-demo-buy-sell-previews
          path: |
            buy-preview.json
            sell-preview.json
          retention-days: 7
          if-no-files-found: warn

  sim-account-readonly:
    name: Isolated WEEX SIM read-only account authentication (NO ORDERS)
    if: github.event_name == 'push' && github.ref == 'refs/heads/sentinel-crypto-orderflow-v1'
    needs: upstream-ccxt-safety
    environment: sentinel-crypto-demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r crypto/futures-demo/requirements.txt
      - name: Prove ONLY simulated Futures account read; never issue an order
        shell: bash
        env:
          WEEX_SIM_API_KEY: ${{ secrets.WEEX_SIM_API_KEY }}
          WEEX_SIM_API_SECRET: ${{ secrets.WEEX_SIM_API_SECRET }}
          WEEX_SIM_API_PASSPHRASE: ${{ secrets.WEEX_SIM_API_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$WEEX_SIM_API_KEY" ] || [ -z "$WEEX_SIM_API_SECRET" ] || [ -z "$WEEX_SIM_API_PASSPHRASE" ]; then
            echo "::notice::SIM ACCOUNT NOT CONNECTED: add the 3 secrets to environment sentinel-crypto-demo"
            printf '%s\n' '{"status":"DEMO_ACCOUNT_NOT_CONNECTED","orders_placed":0}' > sim-auth-result.json
            exit 0
          fi
          python crypto/futures-demo/weex_demo_account.py > sim-auth-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("sim-auth-result.json").read_text())
          assert d["status"]=="SIMULATED_FUTURES_ACCOUNT_REACHABLE", d
          assert d["orders_placed"]==0
          assert d["real_money_orders_enabled"] is False
          assert d["account_balance_values_redacted"] is True
          print("WEEX_SIM_ONLY_ACCOUNT_READ_VERIFIED_NO_ORDERS")
          PY
      - name: Save redacted connection status only (NEVER key, secret or balance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weex-sim-readonly-account-status
          path: sim-auth-result.json
          retention-days: 2
          if-no-files-found: warn
