name: Sentinel Console Build Checks

on:
  push:
    branches: [sentinel-console-isolated-v1]
  workflow_dispatch:

jobs:
  syntax-and-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check sentinel-console/app.js
          node --check sentinel-console/api/gateway.js
      - name: Assert isolated deployment assets
        run: |
          test -s sentinel-console/index.html
          test -s sentinel-console/styles.css
          test -s sentinel-console/vercel.json
          node -e "const c=require('./sentinel-console/vercel.json');if(!c.functions['api/gateway.js'])process.exit(1)"
      - name: Verify no direct live-order endpoints
        run: |
          ! grep -Eq 'place_order|order_send|/trade/execute' sentinel-console/app.js
