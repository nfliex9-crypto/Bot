name: Sentinel Console Build Checks

on:
  push:
    branches: [sentinel-console-isolated-v1, sentinel-quant-hardening-20261118]
  workflow_dispatch:

jobs:
  syntax-and-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check sentinel-console/app.js
          node --check sentinel-console/api/gateway.js
          node --check sentinel-console/api/mt5.js
          node --check sentinel-console/mt5-ui.js
          node --check sentinel-console/cloud-ui.js
          node --check sentinel-console/api/cloud.js
          node --test sentinel-console/tests/cloud.test.cjs
          node --check sentinel-console/api/free-mt5.js
          node --check sentinel-console/free-ui.js
          node --check sentinel-console/brain/orderbook.js
          node --test sentinel-console/tests/orderbook.test.cjs
          node --check sentinel-console/brain/broker-ingestion.js
          node --check sentinel-console/brain/quote-observer.js
          node --test sentinel-console/tests/quote-observer.test.cjs
          node --test sentinel-console/tests/broker-ingestion.test.cjs
          node --check sentinel-console/brain/broker-hypotheses.js
          node --test sentinel-console/tests/broker-hypotheses.test.cjs
          node --check sentinel-console/brain/public-feed.js
          node --check sentinel-console/brain/strategy-factory.js
          node --check sentinel-console/brain/research-radar.js
          node --check sentinel-console/worker/runner.js
          node --check sentinel-console/worker/cron.js
          node --check sentinel-console/api/autonomy.js
          node --test sentinel-console/tests/autonomy.test.cjs
          node --check sentinel-console/brain/robustness.js
          node --check sentinel-console/brain/provenance.js
          node --test sentinel-console/tests/quant-robustness.test.cjs
          node --check sentinel-console/brain/engine.js
          node --check sentinel-console/brain/selector.js
          node --check sentinel-console/brain/trade-memory.js
          node --test sentinel-console/tests/brain-trade-memory.test.cjs
          node --check sentinel-console/api/brain.js
          node --check sentinel-console/brain-ui.js
          node --test sentinel-console/tests/brain.test.cjs
          node --test sentinel-console/tests/brain-selector.test.cjs
          node --test sentinel-console/tests/brain-api.test.cjs
          node --test sentinel-console/tests/free-mt5.test.cjs
          node --test sentinel-console/tests/ui-contract.test.cjs
          node --check sentinel-bridge/native-ingest.js
          node --test sentinel-bridge/tests/native-ingest.test.cjs
          node --check sentinel-bridge/api/mt5.js
      - name: Unit test Windows agent core under mocked MT5
        run: |
          python -m py_compile sentinel-console/mt5-agent/agent.py sentinel-console/mt5-agent/export_history.py sentinel-console/mt5-agent/upload_history.py
          python -m unittest discover -s sentinel-console/mt5-agent -p 'test_agent.py' -v
          python -m unittest discover -s sentinel-console/mt5-agent -p 'test_export_history.py' -v
      - name: Assert isolated deployment assets
        run: |
          test -s sentinel-console/index.html
          test -s sentinel-console/styles.css
          test -s sentinel-console/vercel.json
          node -e "const c=require('./sentinel-console/vercel.json');if(!c.functions['api/gateway.js'])process.exit(1)"
      - name: Verify no direct live-order endpoints
        run: |
          ! grep -Eq 'place_order|order_send|/trade/execute' sentinel-console/app.js

  public-bridge-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify isolated MT5 bridge accepts no unauthenticated devices
        run: |
          set -eu
          base='https://sentinel-mt5-bridge.vercel.app/api/mt5'
          status=$(curl -sS --max-time 20 -o /tmp/mt5_claim.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"code":"SHORT"}' "$base?action=claim")
          test "$status" = "400"
          grep -q '"INVALID_PAIRING_CODE"' /tmp/mt5_claim.json
          status=$(curl -sS --max-time 20 -o /tmp/mt5_heartbeat.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{}' "$base?action=heartbeat")
          test "$status" = "401"
          grep -q '"INVALID_AGENT_AUTH"' /tmp/mt5_heartbeat.json

  windows-installer-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all Windows installer and watchdog PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem sentinel-console/mt5-agent -Filter '*.ps1'
          foreach ($f in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          Write-Host "Parsed $($files.Count) PowerShell scripts"

  console-sso-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Production UI and API require Vercel login
        run: |
          set -euo pipefail
          for path in / '/api/free-mt5?action=status'; do
            status=$(curl -sS --max-time 20 -o /tmp/sso-body -D /tmp/sso-headers -w '%{http_code}' "https://sentinel-mt5-console.vercel.app$path")
            echo "Unauthenticated $path => $status"
            if [ "$status" != "302" ] && [ "$status" != "401" ] && [ "$status" != "403" ]; then
              echo "::error::Console is not protected by Vercel Authentication"
              exit 1
            fi
          done
