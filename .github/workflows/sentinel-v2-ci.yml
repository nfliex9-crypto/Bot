name: Sentinel V2 research-only CI
on:
  push:
    branches: [sentinel-adaptive-intelligence-v2]
    paths:
      - 'sentinel-console/brain/intelligence-v2.js'
      - 'sentinel-console/brain/SENTINEL_ADAPTIVE_INTELLIGENCE_V2.md'
      - 'sentinel-console/worker/cloud-trader/**'
      - 'sentinel-console/worker/orderflow/**'
      - 'sentinel-console/tests/**'
      - '.github/workflows/sentinel-v2-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check sentinel-console/brain/intelligence-v2.js
          node --check sentinel-console/worker/cloud-trader/runner.js
      - name: Research-only regression tests
        run: |
          node --test \
            sentinel-console/tests/intelligence-v2.test.cjs \
            sentinel-console/tests/adaptive-risk.test.cjs \
            sentinel-console/tests/cloud-trader.test.cjs \
            sentinel-console/tests/weekly-demo-review.test.cjs \
            sentinel-console/tests/delta-composite.test.cjs \
            sentinel-console/tests/orderflows-delta.test.cjs \
            sentinel-console/tests/composite-gross.test.cjs
