apiVersion: v1
kind: Namespace
metadata:
  name: trading
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-backend
  namespace: trading
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trading-backend
  template:
    metadata:
      labels:
        app: trading-backend
    spec:
      containers:
        - name: backend
          image: your-registry/trading-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://trader:trader@postgres:5432/trading
            - name: PAPER_MODE
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: trading-backend
  namespace: trading
spec:
  selector:
    app: trading-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-frontend
  namespace: trading
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trading-frontend
  template:
    metadata:
      labels:
        app: trading-frontend
    spec:
      containers:
        - name: frontend
          image: your-registry/trading-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: trading-frontend
  namespace: trading
spec:
  selector:
    app: trading-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: trading
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: trading
            - name: POSTGRES_USER
              value: trader
            - name: POSTGRES_PASSWORD
              value: trader
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: trading
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
