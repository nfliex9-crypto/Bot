version: "3.9"

# ============================================================
# AI Trading Bot — Full Stack
#
# Single-command startup:  docker-compose up --build
#
# Services:
#   api             → FastAPI trading engine   :8000
#   postgres        → Trade/signal database    :5432
#   redis           → Cache / pub-sub          :6379
#   prometheus      → Metrics scraping         :9090  (profile: monitoring)
#   grafana         → Dashboards               :3001  (profile: monitoring)
# ============================================================

x-common-env: &common-env
  TRADING_MODE:            ${TRADING_MODE:-paper}
  APP_ENV:                 ${APP_ENV:-development}
  DEBUG:                   ${DEBUG:-false}
  SECRET_KEY:              ${SECRET_KEY:-dev-secret-key-change-in-production}
  # Database
  DB_HOST:                 postgres
  DB_PORT:                 5432
  DB_NAME:                 ${DB_NAME:-trading_bot}
  DB_USER:                 ${DB_USER:-trader}
  DB_PASSWORD:             ${DB_PASSWORD:-trading_password}
  DATABASE_URL:            postgresql://trader:trading_password@postgres:5432/trading_bot
  # Redis
  REDIS_HOST:              redis
  REDIS_PORT:              6379
  REDIS_URL:               redis://redis:6379/0
  # Broker credentials
  MT5_LOGIN:               ${MT5_LOGIN:-}
  MT5_PASSWORD:            ${MT5_PASSWORD:-}
  MT5_SERVER:              ${MT5_SERVER:-MetaQuotes-Demo}
  BINANCE_API_KEY:         ${BINANCE_API_KEY:-}
  BINANCE_SECRET_KEY:      ${BINANCE_SECRET_KEY:-}
  BINANCE_TESTNET:         ${BINANCE_TESTNET:-true}
  # Risk
  ACCOUNT_BALANCE:         ${ACCOUNT_BALANCE:-3000.0}
  INITIAL_CAPITAL:         ${INITIAL_CAPITAL:-3000.0}
  RISK_PER_TRADE:          ${RISK_PER_TRADE:-0.0075}
  MAX_DRAWDOWN:            ${MAX_DRAWDOWN:-0.15}
  MAX_TRADES_PER_SESSION:  ${MAX_TRADES_PER_SESSION:-3}
  # AI
  MIN_CONFIDENCE:          ${MIN_CONFIDENCE:-0.65}
  # News
  NEWS_API_KEY:            ${NEWS_API_KEY:-}
  # Scan
  SCAN_INTERVAL_SECONDS:   ${SCAN_INTERVAL_SECONDS:-60}
  # Misc
  BOT_AUTO_START:          ${BOT_AUTO_START:-true}
  LOG_DIR:                 /app/logs
  LOG_JSON:                ${LOG_JSON:-false}
  PYTHONPATH:              /app
  PYTHONUNBUFFERED:        "1"

services:

  # ──────────────────────────────────────────────────────────
  # FastAPI + Trading Engine (single process)
  # ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-trading-bot:latest
    container_name: trading-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    volumes:
      - bot_logs:/app/logs
      - bot_models:/app/models
      - bot_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading_net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 8s
      start_period: 60s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ──────────────────────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     trader
      POSTGRES_PASSWORD: trading_password
      POSTGRES_DB:       trading_bot
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - trading_net
    ports:
      - "5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────
  # Redis 7
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - trading_net
    ports:
      - "6379:6379"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ──────────────────────────────────────────────────────────
  # Prometheus  (docker-compose --profile monitoring up)
  # ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: trading-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - trading_net
    ports:
      - "9090:9090"
    profiles:
      - monitoring

  # ──────────────────────────────────────────────────────────
  # Grafana  (docker-compose --profile monitoring up)
  # ──────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: trading-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: trading_admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_HTTP_PORT:        "3001"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - trading_net
    ports:
      - "3001:3001"
    depends_on:
      - prometheus
    profiles:
      - monitoring

# ── Volumes ───────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  bot_logs:
  bot_models:
  bot_data:
  prometheus_data:
  grafana_data:

# ── Networks ──────────────────────────────────────────────────
networks:
  trading_net:
    driver: bridge
