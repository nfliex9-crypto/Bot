version: "3.9"

services:
  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: trading_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_pass}
      POSTGRES_DB: ${POSTGRES_DB:-trading_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_net

  # ─────────────────────────────────────────────
  # Backend API + Trading Engine
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-trader_pass}@db:5432/${POSTGRES_DB:-trading_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-trader_pass}@db:5432/${POSTGRES_DB:-trading_db}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_TESTNET: ${BINANCE_TESTNET:-true}
      MT5_LOGIN: ${MT5_LOGIN:-0}
      MT5_PASSWORD: ${MT5_PASSWORD:-}
      MT5_SERVER: ${MT5_SERVER:-}
      RISK_PER_TRADE_PCT: ${RISK_PER_TRADE_PCT:-0.75}
      MAX_DRAWDOWN_PCT: ${MAX_DRAWDOWN_PCT:-15.0}
      MAX_TRADES_PER_SESSION: ${MAX_TRADES_PER_SESSION:-3}
      TP1_RATIO: ${TP1_RATIO:-1.5}
      TP2_RATIO: ${TP2_RATIO:-2.5}
      TP3_RATIO: ${TP3_RATIO:-4.0}
      MIN_CONFIDENCE_THRESHOLD: ${MIN_CONFIDENCE_THRESHOLD:-0.65}
    volumes:
      - model_data:/app/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trading_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: trading_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - trading_net

  # ─────────────────────────────────────────────
  # pgAdmin (optional - dev only)
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trading_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@trading.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - trading_net
    profiles:
      - dev

volumes:
  postgres_data:
  model_data:

networks:
  trading_net:
    driver: bridge
