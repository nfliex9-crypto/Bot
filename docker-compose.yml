services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: trading_bot
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://trader:trader@db:5432/trading_bot}
      BOT_MODE: ${BOT_MODE:-paper}
      BOT_ENABLED_ON_STARTUP: ${BOT_ENABLED_ON_STARTUP:-true}
      LOOP_INTERVAL_SECONDS: ${LOOP_INTERVAL_SECONDS:-30}
      INITIAL_ACCOUNT_BALANCE: ${INITIAL_ACCOUNT_BALANCE:-3000}
      RISK_PER_TRADE: ${RISK_PER_TRADE:-0.0075}
      MAX_DRAWDOWN: ${MAX_DRAWDOWN:-0.15}
      MAX_TRADES_PER_SESSION: ${MAX_TRADES_PER_SESSION:-3}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.58}
      SYMBOLS_FOREX: ${SYMBOLS_FOREX:-EURUSD,GBPUSD}
      SYMBOLS_CRYPTO: ${SYMBOLS_CRYPTO:-BTC/USDT,ETH/USDT}
      NEWS_BLACKOUT_BEFORE_MINUTES: ${NEWS_BLACKOUT_BEFORE_MINUTES:-30}
      NEWS_BLACKOUT_AFTER_MINUTES: ${NEWS_BLACKOUT_AFTER_MINUTES:-30}
      NEWS_SYNC_URL: ${NEWS_SYNC_URL:-}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_TESTNET: ${BINANCE_TESTNET:-true}
      MT5_LOGIN: ${MT5_LOGIN:-}
      MT5_PASSWORD: ${MT5_PASSWORD:-}
      MT5_SERVER: ${MT5_SERVER:-}
      MT5_PATH: ${MT5_PATH:-}
      MODEL_PATH: ${MODEL_PATH:-artifacts/random_forest.joblib}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
