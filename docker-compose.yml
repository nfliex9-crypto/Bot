version: "3.8"

services:
  trading-bot:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TRADING_MODE=paper
      - DATABASE_URL=postgresql://trading:trading@postgres:5432/trading_bot
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  celery-worker:
    build: .
    environment:
      - TRADING_MODE=paper
      - DATABASE_URL=postgresql://trading:trading@postgres:5432/trading_bot
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/app
    command: celery -A app.worker.celery_app worker --loglevel=info
    restart: unless-stopped

  celery-beat:
    build: .
    environment:
      - TRADING_MODE=paper
      - DATABASE_URL=postgresql://trading:trading@postgres:5432/trading_bot
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/app
    command: celery -A app.worker.celery_app beat --loglevel=info
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
