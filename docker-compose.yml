version: "3.9"

services:
  # ============================================================
  # Trading Bot API + Bot Engine
  # ============================================================
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-trading-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TRADING_MODE=${TRADING_MODE:-paper}
      - DATABASE_URL=postgresql://trader:trading_password@postgres:5432/trading_bot
      - REDIS_URL=redis://redis:6379/0
      - MT5_LOGIN=${MT5_LOGIN:-}
      - MT5_PASSWORD=${MT5_PASSWORD:-}
      - MT5_SERVER=${MT5_SERVER:-MetaQuotes-Demo}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY:-}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      - ACCOUNT_BALANCE=${ACCOUNT_BALANCE:-3000.0}
      - RISK_PER_TRADE=${RISK_PER_TRADE:-0.0075}
      - MAX_DRAWDOWN=${MAX_DRAWDOWN:-0.15}
      - MAX_TRADES_PER_SESSION=${MAX_TRADES_PER_SESSION:-3}
      - MIN_CONFIDENCE=${MIN_CONFIDENCE:-0.65}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - BOT_AUTO_START=${BOT_AUTO_START:-true}
    volumes:
      - bot_logs:/app/logs
      - bot_models:/app/models
      - bot_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trading_password
      POSTGRES_DB: trading_bot
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - trading_network
    ports:
      - "5432:5432"

  # ============================================================
  # Redis Cache (for rate limiting, pub/sub)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - trading_network
    ports:
      - "6379:6379"

  # ============================================================
  # Grafana + Prometheus Monitoring (optional)
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: trading-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - trading_network
    ports:
      - "9090:9090"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: trading-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=trading_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - trading_network
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  bot_logs:
  bot_models:
  bot_data:
  prometheus_data:
  grafana_data:

networks:
  trading_network:
    driver: bridge
