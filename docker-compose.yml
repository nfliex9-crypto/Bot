version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://trading:trading@db:5432/trading_db
      - DATABASE_URL_SYNC=postgresql+psycopg2://trading:trading@db:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-prod}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_TESTNET=true
      - MT5_LOGIN=${MT5_LOGIN:-0}
      - MT5_PASSWORD=${MT5_PASSWORD:-}
      - MT5_SERVER=${MT5_SERVER:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ai_models:/app/app/ai_layer/models
    restart: unless-stopped
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: trading-db
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-ARGS", "pg_isready", "-U", "trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-migrate
    command: >
      sh -c "
        sleep 5 &&
        alembic upgrade head
      "
    environment:
      - DATABASE_URL_SYNC=postgresql+psycopg2://trading:trading@db:5432/trading_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trading-net

volumes:
  postgres_data:
  redis_data:
  ai_models:

networks:
  trading-net:
    driver: bridge
