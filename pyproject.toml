[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-bot"
version = "0.1.0"
description = "Professional multi-asset AI automated trading bot for MT5 and Binance."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenAI" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "SQLAlchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.3.0",
    "scikit-learn>=1.5.0",
    "python-binance>=1.0.19",
    "httpx>=0.27.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
mt5 = [
    "MetaTrader5>=5.0.45",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
