[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-bot"
version = "0.1.0"
description = "Automated multi-market AI trading bot for MetaTrader5 and Binance."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pandas",
  "numpy",
  "sqlalchemy",
  "psycopg[binary]",
  "pydantic-settings",
  "httpx",
  "scikit-learn",
  "joblib",
  "python-binance",
  "tenacity",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
mt5 = [
  "MetaTrader5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
